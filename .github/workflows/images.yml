name: Publish uploaded images
on:
  push:
    branches: [main]
    paths: ['images/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: images, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow numpy scipy
      - name: Convert images and rebuild pages
        run: |
          cd build
          python process_images.py
          python split_panels.py
          STATIC=.. python gen_seasons.py
          STATIC=.. python gen_india.py
          python build_home.py
          python season_prompts.py
          python india_prompts.py
          python seo.py
      - name: Commit
        run: |
          git config user.name "forecut-bot"
          git config user.email "hello@forecut.in"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish uploaded images"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((RANDOM % 8 + 3))
            git pull --rebase -X theirs origin main || { git checkout --theirs . && git add -A && GIT_EDITOR=true git rebase --continue; }
          done
          exit 1
  deploy:
    needs: publish
    uses: ./.github/workflows/pages.yml
